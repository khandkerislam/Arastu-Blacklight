services:
  app-base:
    build:
      context: .
      dockerfile: development.Dockerfile
    volumes:
      - .:/usr/src/app
  web:
    extends: 
      service: app-base
    ports: 
      - "3000:3000"
    command: bash -c "chmod +x bin/* && rm -f /usr/src/app/tmp/pids/server.pid && yarn && bundle && ./bin/dev"
    depends_on:
      - postgres
      - redis
      - solr
  test:
    extends: 
      service: app-base
    environment:
      - RAILS_ENV=test
    depends_on:
      - postgres
      - redis
      - solr
  storybook:
    extends:
      service: app-base
    ports:
      - "6006:6006"
    command: npm run storybook
  solr:
    image: solr
    user: "8983:8983"
    ports:
     - "8983:8983"
    volumes:
      - ./blacklight-core:/var/solr/data/blacklight-core:rw
    command: solr-precreate blacklight-core
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:latest
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: seattle_library_development
    volumes:
      - seattle_library_postgres_data:/var/lib/postgresql/data
  sidekiq:
    extends: 
      service: app-base
    depends_on:
      - redis
      - postgres
volumes:
  redis-data:
  seattle_library_postgres_data:
